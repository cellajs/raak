---
allowBuilds:
  '@evilmartians/lefthook': true
  '@playwright/browser-chromium': false
  core-js: false
  esbuild: true
  protobufjs: false
  unix-dgram: false
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@cellajs/cli'
  - moment@2.31.0
  - browserslist@4.28.7
  - brace-expansion@5.0.12
  - brace-expansion@5.0.11
  - brace-expansion@5.0.10
  - '@grpc/grpc-js@1.14.5'
  - smol-toml@1.8.1
  - source-map-js@1.2.2
  - joi@17.13.8
  - postcss-selector-parser@7.1.6
overrides:
  # 7.29.10 makes @tanstack/router-plugin 1.168.42 emit an undefined export for a route whose split
  # component shares a local binding with a non-split prop (t.$id.tsx), which fails `vite build`.
  '@babel/traverse': 7.29.7
  '@grpc/grpc-js@>=1.14.0 <1.14.5': ^1.14.5
  brace-expansion@>=4.0.0 <5.0.10: ^5.0.10
  brace-expansion@>=4.0.0 <5.0.11: ^5.0.11
  brace-expansion@>=4.0.0 <5.0.12: ^5.0.12
  browserslist@<=4.28.6: ^4.28.7
  csv-parse@<7.0.2: ^7.0.2
  esbuild@<0.28.1: ^0.28.1
  http-cache-semantics@<=4.2.0: ^4.3.0
  joi@<17.13.8: ^17.13.8
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  moment@>=2.29.2 <2.31.0: ^2.31.0
  postcss-selector-parser@<7.1.6: ^7.1.6
  shell-quote@>=1.8.4 <1.11.0: ^1.11.0
  smol-toml@<=1.8.0: ^1.8.1
  source-map-js@>=1.0.0 <1.2.2: ^1.2.2
packageExtensions:
  '@artilleryio/sketches-js':
    dependencies:
      protobufjs: ^7.2.4
  artillery:
    dependencies:
      esbuild: ^0.28.1
packages:
  - mcp
  - oauth
  - jobs
  - backend
  - cdc
  - shared
  - frontend
  - infra
  - sdk
  - studio
  - yjs
  - bench
  - a11y
patchedDependencies:
  artillery@2.0.34: patches/artillery@2.0.34.patch
peerDependencyRules:
  allowedVersions:
    vite: '8'
publicHoistPattern:
  - pdfjs-dist
